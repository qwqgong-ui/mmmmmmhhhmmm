name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: false
  push:
    branches:
      - dev
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - dev

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # Skip mihomo inbound interop test
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go 1.27
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.27.0"

      - name: Apply dependency patches
        shell: bash
        run: sh patches/apply-dependency-patches.sh "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1 \
            -tags "no_tailscale no_zerotier no_wireguard no_openvpn no_mieru no_sudoku no_fake_tcp no_easytier"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs:
          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: android, goarch: arm64, goarm64: v8.0, ndk: aarch64-linux-android34, output: arm64-v8 }

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go 1.27
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.27.0"

      - name: Set variables
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          VERSION="${VERSION//\//-}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date -u)" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
          echo "BUILDTAG=-extldflags --static" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        if: matrix.jobs.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Set Android NDK path
        if: matrix.jobs.goos == 'android'
        shell: bash
        run: |
          echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.jobs.ndk }}-clang" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-O3 -fvisibility=hidden -ffunction-sections -fdata-sections" >> "$GITHUB_ENV"
          echo "CGO_CXXFLAGS=-O3 -fvisibility=hidden -ffunction-sections -fdata-sections" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-Wl,-O2,--gc-sections" >> "$GITHUB_ENV"
          echo "BUILDTAG=" >> "$GITHUB_ENV"

      - name: Apply dependency patches
        shell: bash
        run: sh patches/apply-dependency-patches.sh "$GITHUB_ENV"

      - name: Build core
        shell: bash
        env:
          GOEXPERIMENT: simd
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          GOAMD64: ${{ matrix.jobs.goamd64 }}
          GOARM64: ${{ matrix.jobs.goarm64 }}
        run: |
          set -euo pipefail
          go build -v \
            -tags "no_tailscale no_zerotier no_wireguard no_openvpn no_mieru no_sudoku no_fake_tcp no_easytier" \
            -trimpath \
            -ldflags "${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="

          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            mv mihomo.exe "mihomo-windows-${{ matrix.jobs.output }}.exe"
            zip -j "mihomo-windows-${{ matrix.jobs.output }}-${VERSION}.zip" "mihomo-windows-${{ matrix.jobs.output }}.exe"
          else
            mv mihomo "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
            gzip -c "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}" > "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}-${VERSION}.gz"
          fi

      - name: Save version
        shell: bash
        run: echo "${VERSION}" > version.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          path: |
            mihomo*.gz
            mihomo*.zip
            version.txt

  upload-prerelease:
    permissions:
      contents: write
    if: github.event_name != 'workflow_dispatch' && github.ref_type == 'branch' && !startsWith(github.event_name, 'pull_request')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Calculate checksums
        shell: bash
        run: |
          cd bin
          find . -type f -not -name 'checksums.txt' -not -name 'version.txt' | sort | xargs sha256sum > checksums.txt

      - name: Delete current prerelease assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-${{ github.ref_name }}
          deleteOnlyFromDrafts: false

      - name: Update prerelease tag
        uses: richardsimko/update-tag@v1
        with:
          tag_name: Prerelease-${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Prerelease-${{ github.ref_name }}
          files: bin/*
          prerelease: true
          generate_release_notes: true
